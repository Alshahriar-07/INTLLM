[project]
name = "intllm"
# Version is single-sourced from app/__init__.py (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "INTLLM local AI runtime backend (FastAPI orchestration over Ollama, PostgreSQL and INTLLM tools)."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Al Shahriar Sowan" }]
keywords = [
    "intllm",
    "local-ai",
    "ollama",
    "openai-compatible",
    "fastapi",
    "pgvector",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "greenlet>=3.1.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
]

[project.urls]
Homepage = "https://intllm.vercel.app"
Repository = "https://github.com/Alshahriar-07/INTLLM"
Issues = "https://github.com/Alshahriar-07/INTLLM/issues"
Changelog = "https://github.com/Alshahriar-07/INTLLM/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = ["playwright>=1.48.0"]
gpu = ["pynvml>=11.5.0"]
# Bundled PostgreSQL + pgvector binaries for the INTLLM-managed local database
# runtime (used by the packaged desktop application).
postgres = ["pgserver>=0.1.4"]
# Native desktop window for the production application (WebView2 on Windows).
# The Windows executable bundles this; other platforms may install it to get a
# desktop window instead of the headless backend + browser workflow.
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[project.scripts]
intllm = "app.cli:main"
intllm-api = "app.main:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100


