[project]
name = "intllm-backend"
version = "0.4.2"
description = "INTLLM local AI runtime backend (FastAPI orchestration over Ollama, PostgreSQL and INTLLM tools)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "greenlet>=3.1.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48.0"]
gpu = ["pynvml>=11.5.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
intllm-api = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
