name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intllm
          POSTGRES_PASSWORD: intllm
          POSTGRES_DB: intllm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intllm -d intllm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTLLM_TEST_DATABASE_URL: postgresql+asyncpg://intllm:intllm@127.0.0.1:5432/intllm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
      - name: Lint (ruff)
        run: ruff check --config backend/pyproject.toml backend/app backend/tests build_windows.py scripts
      - name: Type/import smoke (python -m compileall)
        run: python -m compileall -q backend/app
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify installer files are served from dist
        run: |
          test -f dist/install.ps1
          test -f dist/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  packaging:
    name: Python package validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip "build>=1.2.0"
          python scripts/build_release.py --skip-windows --release-dir build/release
      - name: Validate artifacts
        run: python scripts/validate_release.py build/release --install-check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: build/release
          retention-days: 7
